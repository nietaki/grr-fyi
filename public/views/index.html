<!DOCTYPE html>
<html
    lang="en"
    dir="ltr"
    x-data="combined"
>
<head>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
	<script src="/js/main.js"></script>
  <link rel="stylesheet" href="/css/pico/pico.grey.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="box">
			<form action="/randomfile" method="get" target="file_frame">
			<div class="row header grid">
				<label>
						<legend>(pdfs) containing text</legend>
						<div role="search">
							<input type="search" placeholder="coming soon..." disabled />
							<input type="reset" value="clear" />
						</div>
				</label>
				<fieldset>
					<legend>file types</legend>
					<input type="checkbox" name="filetypes[]" value="pdf" id="pdf" checked />
					<label for="pdf">PDF</label>
					<input type="checkbox" name="filetypes[]" value="audio" id="audio" checked />
					<label for="audio">audio</label>
					<input type="checkbox" name="filetypes[]" value="video" id="video" checked />
					<label for="video">video</label>
					<input type="checkbox" name="filetypes[]" value="other" id="other" />
					<label for="other">other</label>
				</fieldset>
				<button type="submit">Another one!</button>
			</div>
		</form>
		<div class="row content">
			<iframe name="file_frame" src="/randomfile" width="100%" height="100%">
			</iframe>
		</div>
		<div class="row footer grid">
			<div class="left">
					{{.fileCount}} files so far
			</div>
			<div class="right">
				Epstein Roulette, whipped up and hosted by <a href="https://nietaki.com/">nietaki</a>
			</div>
		</div>
  </div>
</body>
</html>
