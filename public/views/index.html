    dir="ltr"

<head>
	<!-- HTML Meta Tags -->

	<meta property="og:description" content="Files categorised into video, audio and PDFiles for your peeping pleasure. PDFiles' content search coming soon!">

	<!-- Twitter Meta Tags -->

	<!-- Meta Tags Generated via https://www.opengraph.xyz -->
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

	<script defer data-domain="epsteinroulette.win" src="/js/script.file-downloads.outbound-links.pageview-props.tagged-events.js"></script>
	<script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>

	<script src="/js/main.js"></script>
  <link rel="stylesheet" href="/css/pico/pico.grey.min.css">
  <link rel="stylesheet" href="/css/main.css">

</head>
<body>
  <div class="box">
			<form action="/randomfile" method="post" target="file_frame" onsubmit="plausible('another one')">
			<div class="row header grid">
				<label>
						<legend>(pdfs) containing text</legend>
						<div role="search">
							<input type="search" placeholder="coming soon..." disabled />
							<input type="reset" value="clear" />
						</div>
				</label>
				<fieldset>
					<legend>file types</legend>
					<input type="checkbox" name="filetypes[]" value="pdf" id="pdf" checked />
					<label for="pdf">PDF</label>
					<input type="checkbox" name="filetypes[]" value="audio" id="audio" checked />
					<label for="audio">audio</label>
					<input type="checkbox" name="filetypes[]" value="video" id="video" checked />
					<label for="video">video</label>
					<input type="checkbox" name="filetypes[]" value="other" id="other" />
					<label for="other">other</label>
				</fieldset>
				<button type="submit" class="contrast">Another one!</button>
			</div>
		</form>
		<div class="row content">
			<iframe name="file_frame" src="/randomfile" width="100%" height="100%">
			</iframe>
		</div>
		<div class="row footer grid">
			<div class="left">
					<small>
					{{.fileCount}} files so far
					</small>
			</div>
			<div class="right">
				<small>
					<a href="https://epsteinroulette.win/">Epstein Roulette</a> based on  data from <a href="https://github.com/yung-megafone/Epstein-Files" target="_blank">young-megafone</a>, whipped up by <a href="https://nietaki.com/">nietaki</a>
				</small>
			</div>
		</div>
  </div>
</body>
</html>
