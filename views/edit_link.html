{{define "content"}}
<article x-data="editLink">
  <h3>Edit Link</h3>

  <label>
    Target URL
    <input type="url" value="{{.TargetURL}}" readonly>
  </label>

  <label>
    Short URL
    <fieldset role="group">
      <input type="url" x-ref="shortUrl" value="{{.ShortURL}}" readonly>
      <button type="button" @click="copyShortUrl" x-text="copied ? 'Copied!' : 'Copy'">Copy</button>
    </fieldset>
  </label>

  <label>
    Edit Page URL
    <input type="url" value="{{.EditURL}}" readonly>
  </label>
</article>
{{end}}
