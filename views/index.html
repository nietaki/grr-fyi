{{define "content"}}
<div x-data="createLink">
  <form @submit.prevent="submit">
    <fieldset>
      <label>
        URL to shorten
        <input type="url" x-model="targetUrl" placeholder="https://example.com/very-long-url" required
               :aria-invalid="error ? 'true' : 'false'" aria-describedby="form-error">
      </label>
      <fieldset role="group">
        <input type="text" x-model="customSlug" placeholder="Custom slug (optional)">
        <input type="submit" value="Shorten" :disabled="loading">
      </fieldset>
    </fieldset>

    <small id="form-error" x-show="error" x-text="error" class="error"></small>
  </form>
</div>
{{end}}
